<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Old Car Price Prediction</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h2>🚗 Old Car Price Prediction System</h2>
      </header>

      <section class="heading">
        <h1>Old Car Price Prediction</h1>
        <p>Predict the estimated selling price of your used car</p>
      </section>

      <main>
        <section class="form-card">
          <h2>Vehicle Parameters</h2>

          <form id="carForm">
            <div class="form-group">
              <label>Car Name</label>
              <input
                type="text"
                id="Car_name"
                placeholder="Example: Hyundai Creta"
                required
              />
            </div>

            <div class="form-group">
              <label>Year</label>
              <input
                type="number"
                id="Year"
                placeholder="Example: 2018"
                required
              />
            </div>

            <div class="form-group">
              <label>KM Driven</label>
              <input
                type="number"
                id="KM_Driven"
                placeholder="Example: 45000"
                min="0"
                required
              />
            </div>

            <div class="form-group">
              <label>Fuel Type</label>
              <select id="Fuel_Type" required>
                <option value="">Select Fuel</option>
                <option value="Petrol">Petrol</option>
                <option value="Diesel">Diesel</option>
                <option value="CNG">CNG</option>
              </select>
            </div>

            <div class="form-group">
              <label>Seller Type</label>
              <select id="Seller_Type" required>
                <option value="">Select Seller</option>
                <option value="Dealer">Dealer</option>
                <option value="Individual">Individual</option>
              </select>
            </div>

            <div class="form-group">
              <label>Transmission</label>
              <select id="Transmission" required>
                <option value="">Select Transmission</option>
                <option value="Manual">Manual</option>
                <option value="Automatic">Automatic</option>
              </select>
            </div>

            <div class="form-group">
              <label>Owner</label>
              <select id="Owner" required>
                <option value="">Select Owner</option>
                <option value="0">First Owner (0)</option>
                <option value="1">Second Owner (1)</option>
                <option value="2">Third Owner (2)</option>
                <option value="3">Fourth Owner (3)</option>
              </select>
            </div>

            <div class="form-group">
              <label>Present Price (Lakhs)</label>
              <input
                type="number"
                id="Present_Price_Lakh"
                placeholder="Example: 8.50"
                min="0"
                step="0.01"
                required
              />
            </div>

            <button type="submit" id="predictBtn">Predict Selling Price</button>
          </form>
        </section>

        <section class="result-card">
          <h2>Predicted Resale Value</h2>

          <div class="price" id="price">₹ 0.00 Lakhs</div>

          <p id="message">Enter vehicle details and click Predict.</p>

          <div class="status" id="status">
            Model: Machine Learning<br />
            API Status: Waiting
          </div>
        </section>
      </main>

      <footer>Old Car Price Prediction</footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
